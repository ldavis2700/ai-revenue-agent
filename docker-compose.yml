version: '3.8'

networks:
  ai_agent_network:
    driver: bridge

volumes:
  n8n_storage:
  postgres_storage:
  redis_storage:
  revenue_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: n8n_postgres
    restart: always
    networks:
      - ai_agent_network
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - postgres_storage:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    container_name: n8n_redis
    restart: always
    networks:
      - ai_agent_network
    volumes:
      - redis_storage:/data

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    container_name: n8n_engine
    restart: always
    networks:
      - ai_agent_network
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./scripts:/files/scripts:ro
    depends_on:
      - postgres
      - redis

  inbound:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    container_name: revenue_inbound
    restart: always
    networks:
      - ai_agent_network
    command: ["/opt/venv/bin/python3", "/files/scripts/inbound_server.py"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - REVENUE_DB_PATH=/files/data/revenue_agent.db
      - INBOUND_ALLOWED_ORIGINS=${INBOUND_ALLOWED_ORIGINS}
    volumes:
      - ./scripts:/files/scripts:ro
      - revenue_data:/files/data
