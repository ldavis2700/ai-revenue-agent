name: APEX Business Model Intelligence

on:
  pull_request:
    paths:
      - 'config/business_models.json'
      - 'scripts/business_model_intelligence.py'
      - 'scripts/weekly_model_to_cash.py'
      - 'scripts/wealth_expertise_audit.py'
      - 'scripts/self_improvement_cycle.py'
      - 'revenue_worker.py'
      - 'tests/test_business_model_intelligence.py'
      - 'tests/test_weekly_model_to_cash.py'
      - 'tests/test_wealth_expertise_audit.py'
      - 'tests/test_self_improvement_cycle.py'
      - '.github/workflows/business-model-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'config/business_models.json'
      - 'scripts/business_model_intelligence.py'
      - 'scripts/weekly_model_to_cash.py'
      - 'scripts/wealth_expertise_audit.py'
      - 'scripts/self_improvement_cycle.py'
      - 'revenue_worker.py'
      - 'tests/test_business_model_intelligence.py'
      - 'tests/test_weekly_model_to_cash.py'
      - 'tests/test_wealth_expertise_audit.py'
      - 'tests/test_self_improvement_cycle.py'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

concurrency:
  group: apex-business-model-intelligence
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile intelligence engine
        run: python -m py_compile scripts/business_model_intelligence.py scripts/weekly_model_to_cash.py scripts/wealth_expertise_audit.py scripts/self_improvement_cycle.py
      - name: Run intelligence tests
        run: python -m unittest discover -s tests -p 'test_business_model_intelligence.py' -v
      - name: Test weekly buyer-evidence and conversion gates
        run: python -m unittest discover -s tests -p 'test_weekly_model_to_cash.py' -v
      - name: Test evidence-based wealth expertise audit
        run: python -m unittest discover -s tests -p 'test_wealth_expertise_audit.py' -v
      - name: Test daily self-improvement evidence gate
        run: python -m unittest discover -s tests -p 'test_self_improvement_cycle.py' -v
      - name: Exercise low-cost autonomous portfolio ranking
        run: |
          python scripts/business_model_intelligence.py --limit 8 --max-startup-cost 3 --max-owner-effort 5 --max-compliance-risk 4 --min-speed-to-revenue 5 --min-automation 6 > /tmp/apex-models.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/apex-models.json'))
          assert data['catalog_size'] >= 35
          assert data['count'] > 0
          assert data['guardrails']['recommendation_only'] is True
          assert data['guardrails']['automatic_spend'] is False
          assert all(item['eligible'] for item in data['candidates'])
          PY
      - name: Publish intelligence snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: apex-business-model-intelligence-${{ github.run_id }}
          path: /tmp/apex-models.json
          retention-days: 14
