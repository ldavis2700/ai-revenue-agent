name: Revenue Agent CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile scripts/*.py
      - name: Smoke test CSV import and revenue cycle
        env:
          REVENUE_DB_PATH: /tmp/revenue_agent.db
        run: |
          printf 'first_name,company_name,contact_email,industry,pain_point,website,contact_allowed\nJane,Jane Plumbing,jane@example.com,Home Services,slow inquiry follow-up,https://example.com,true\n' > /tmp/leads.csv
          python scripts/import_leads.py /tmp/leads.csv | python scripts/revenue_cycle.py > /tmp/result.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/result.json'))
          assert data['metrics']['processed'] == 1
          assert data['metrics']['contact_ready'] == 1
          assert data['contact_ready'][0]['outreach']['score'] >= 55
          PY
      - name: Smoke test outbound policy
        run: |
          python scripts/outbound_policy.py --json '{"channel":"sms","consent":false,"contact_allowed":true}' > /tmp/sms_blocked.json
          python scripts/outbound_policy.py --json '{"channel":"sms","consent":true,"contact_allowed":true}' > /tmp/sms_allowed.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/sms_blocked.json'))['allowed'] is False
          assert json.load(open('/tmp/sms_allowed.json'))['allowed'] is True
          PY
      - name: Smoke test checkout generation and interested action
        env:
          REVENUE_DB_PATH: /tmp/revenue_agent.db
          CHECKOUT_URL_TEMPLATE: "https://pay.example.test/checkout?lead={lead_id}&email={email}&amount={amount}&offer={offer}"
        run: |
          LEAD_ID=$(python - <<'PY'
          import sqlite3
          c=sqlite3.connect('/tmp/revenue_agent.db')
          print(c.execute('select id from leads limit 1').fetchone()[0])
          PY
          )
          python scripts/checkout_link.py "$LEAD_ID" --email jane@example.com > /tmp/checkout.json
          python scripts/record_event.py "$LEAD_ID" interested
          python scripts/next_actions.py > /tmp/actions.json
          python - <<'PY'
          import json
          checkout=json.load(open('/tmp/checkout.json'))
          actions=json.load(open('/tmp/actions.json'))
          assert checkout['ready'] is True
          assert actions['actions'][0]['action'] == 'send_checkout'
          assert 'pay.example.test' in actions['actions'][0]['checkout_url']
          PY
      - name: Smoke test idempotent payment and reporting
        env:
          REVENUE_DB_PATH: /tmp/revenue_agent.db
        run: |
          LEAD_ID=$(python - <<'PY'
          import sqlite3
          c=sqlite3.connect('/tmp/revenue_agent.db')
          print(c.execute('select id from leads limit 1').fetchone()[0])
          PY
          )
          python scripts/record_payment.py "$LEAD_ID" evt_ci_1 --amount 100 --processor test > /tmp/pay1.json
          python scripts/record_payment.py "$LEAD_ID" evt_ci_1 --amount 100 --processor test > /tmp/pay2.json
          python scripts/revenue_report.py > /tmp/report.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/pay1.json'))['duplicate'] is False
          assert json.load(open('/tmp/pay2.json'))['duplicate'] is True
          report=json.load(open('/tmp/report.json'))
          assert report['sales'] == 1
          assert report['net_revenue'] == 100
          PY
