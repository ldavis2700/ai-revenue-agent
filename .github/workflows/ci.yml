name: Revenue Agent CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stripe-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: apex_test
    steps:
      - uses: actions/checkout@v4
      - name: Test ledger deduplication against disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls; create table public.inbound_leads (id uuid primary key);'
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260813173601_verified_revenue_events.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112023000_revenue_source_deduplication.sql
          psql -v ON_ERROR_STOP=1 -f tests/stripe_revenue_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112030000_paid_fulfillment_queue.sql
          psql -v ON_ERROR_STOP=1 -f tests/paid_fulfillment_queue.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112034920_paid_preparation_leases.sql
          psql -v ON_ERROR_STOP=1 -f tests/paid_preparation_leases.sql
          APEX_DISPOSABLE_POSTGRES=1 python3 tests/paid_preparation_concurrency.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile revenue_worker.py autonomous_cycle.py delivery_adapter.py dispatch_recovery.py free_delivery_policy.py scripts/*.py
      - name: Test offline evidence-to-review demonstration
        run: python -m unittest discover -s examples/evidence_review -p 'test_research_evidence_demo.py' -v
      - name: Build and smoke test continuous worker container
        run: |
          docker build -f Dockerfile.worker -t apex-worker-ci .
          docker run --rm --read-only --tmpfs /tmp --tmpfs /files/data:uid=10001,gid=10001 -e DELIVERY_ENABLED=false apex-worker-ci python revenue_worker.py --once
      - name: Test weekly video planning
        run: python -m unittest discover -s tests -p 'test_weekly_video_plan.py' -v
      - name: Test consent-first customer-response pilot
        run: python -m unittest discover -s tests -p 'test_consent_first_inquiry_pilot.py' -v
      - name: Test daily self-improvement review
        run: python -m unittest discover -s tests -p 'test_self_improvement_cycle.py' -v
      - name: Test persistent content queue
        run: python -m unittest discover -s tests -p 'test_content_worker.py' -v
      - name: Test guarded paid preparation consumer
        run: python -m unittest discover -s tests -p 'test_paid_preparation_consumer.py' -v
      - name: Build and render with content container
        timeout-minutes: 12
        run: |
          docker build -f Dockerfile.content -t apex-content-ci .
          docker run --rm --memory=256m --cpus=1 --read-only --tmpfs /tmp --tmpfs /data apex-content-ci /app/content-entrypoint.sh --once
      - name: Test consented autonomy routing
        run: |
          python -m unittest discover -s tests -p 'test_public_market_research.py' -v
          python -m unittest discover -s tests -p 'test_runtime_supervisor.py' -v
          python -m unittest discover -s tests -p 'test_revenue_cycle_consent.py' -v
          python -m unittest discover -s tests -p 'test_autonomous_cycle.py' -v
          python -m unittest discover -s tests -p 'test_dispatch_recovery.py' -v
          python -m unittest discover -s tests -p 'test_delivery_adapter.py' -v
          python -m unittest discover -s tests -p 'test_free_delivery_policy.py' -v
          python -m unittest discover -s tests -p 'test_revenue_worker.py' -v
          python -m unittest discover -s tests -p 'test_opportunity_intake.py' -v
          python -m unittest discover -s tests -p 'test_consignment_payout.py' -v
          python -m unittest discover -s tests -p 'test_notification_audit.py' -v
          python -m unittest discover -s tests -p 'test_setup_fulfillment.py' -v
          python -m unittest discover -s tests -p 'test_build_response_pack.py' -v
          python -m unittest discover -s tests -p 'test_sales_checkout_pause.py' -v
      - name: Verify combined runtime and private state
        timeout-minutes: 3
        run: |
          docker run -d --name apex-combined-ci --memory=256m --cpus=1 --read-only --tmpfs /tmp --tmpfs /data -e APEX_REVENUE_WORKER_ENABLED=true -e APEX_PUBLIC_RESEARCH_ENABLED=false -e DELIVERY_ENABLED=false apex-content-ci
          trap 'docker logs apex-combined-ci; docker rm -f apex-combined-ci' EXIT
          docker exec apex-combined-ci python3 -c '
          import json,time,urllib.request,urllib.error
          deadline=time.monotonic()+90
          while time.monotonic()<deadline:
              try:
                  result=json.load(urllib.request.urlopen("http://127.0.0.1:8080/health",timeout=5))
                  if result["healthy"] and result["revenue_worker"]["healthy"]: break
              except (OSError,ValueError): pass
              time.sleep(1)
          else: raise SystemExit("combined worker never healthy")
          for path in ("/revenue/revenue_agent.db","/data/revenue/revenue_agent.db","/scripts/public_market_research.py"):
              try: urllib.request.urlopen("http://127.0.0.1:8080"+path,timeout=5)
              except urllib.error.HTTPError as exc: assert exc.code==404
              else: raise AssertionError("private route exposed")
          '
      - name: Smoke test referral attribution loop
        env:
          REVENUE_DB_PATH: /tmp/referral_agent.db
        run: |
          set +e
          python scripts/referral_program.py create-partner 'Partner One' --code PARTNER1 >/tmp/ref-disabled.txt 2>&1
          DISABLED_STATUS=$?
          set -e
          test "$DISABLED_STATUS" -ne 0
          REFERRAL_PROGRAM_ENABLED=true python scripts/referral_program.py create-partner 'Partner One' --code PARTNER1 > /tmp/ref-partner.json
          REFERRAL_PROGRAM_ENABLED=true python scripts/referral_program.py record PARTNER1 lead --lead-id lead-1 > /tmp/ref-lead.json
          REFERRAL_PROGRAM_ENABLED=true python scripts/referral_program.py record PARTNER1 sale --lead-id lead-1 --value 100 > /tmp/ref-sale.json
          python scripts/referral_program.py report > /tmp/ref-report.json
          python - <<'PY'
          import json
          partner=json.load(open('/tmp/ref-partner.json'))
          lead=json.load(open('/tmp/ref-lead.json'))
          sale=json.load(open('/tmp/ref-sale.json'))
          report=json.load(open('/tmp/ref-report.json'))
          assert partner['code'] == 'PARTNER1'
          assert lead['duplicate'] is False
          assert sale['duplicate'] is False
          assert report['active_partners'] == 1
          assert report['leads'] == 1
          assert report['sales'] == 1
          assert report['attributed_revenue'] == 100
          assert report['payouts_enabled'] is False
          PY
      - name: Smoke test Supabase APEX request contract
        env:
          APEX_REVENUE_URL: https://example.supabase.co/functions/v1/apex-runtime
          APEX_AUTH_MODE: supabase_edge
          APEX_API_KEY: test_secret_key
          APEX_PROPERTY_ID: '003'
        run: |
          python - <<'PY'
          import importlib.util, json
          spec=importlib.util.spec_from_file_location('record_payment','scripts/record_payment.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          req=mod.build_apex_request(processor_event_id='evt_contract_1', amount=100, currency='usd', processor='test', occurred_at='2026-08-11T00:00:00+00:00')
          assert req is not None
          assert req.headers['Apikey'] == 'test_secret_key'
          assert 'Authorization' not in req.headers
          payload=json.loads(req.data.decode())
          assert payload['action'] == 'ingest_verified_revenue'
          assert payload['propertyId'] == '003'
          assert payload['externalEventId'] == 'evt_contract_1'
          assert payload['amountCents'] == 10000
          assert payload['currency'] == 'USD'
          assert payload['verified'] is True
          PY
      - name: Smoke test industry templates
        run: |
          python scripts/render_industry_template.py home_services --company 'Jane Plumbing' --first-name Jane --service 'water heater repair' > /tmp/template.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/template.json'))
          assert data['industry_key'] == 'home_services'
          assert data['company'] == 'Jane Plumbing'
          assert 'Jane Plumbing' in data['responses']['new_inquiry']
          assert 'water heater repair' in data['responses']['follow_up']
          assert len(data['responses']) == 7
          PY
      - name: Smoke test CSV import and revenue cycle
        env:
          REVENUE_DB_PATH: /tmp/revenue_agent.db
        run: |
          printf 'first_name,company_name,contact_email,industry,pain_point,website,contact_allowed\nJane,Jane Plumbing,jane@example.com,Home Services,slow inquiry follow-up,https://example.com,true\n' > /tmp/leads.csv
          python scripts/import_leads.py /tmp/leads.csv | python scripts/revenue_cycle.py > /tmp/result.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/result.json'))
          assert data['metrics']['processed'] == 1
          assert data['metrics']['contact_ready'] == 1
          assert data['contact_ready'][0]['outreach']['score'] >= 55
          PY
      - name: Smoke test outbound policy
        run: |
          python scripts/outbound_policy.py --json '{"channel":"sms","consent":false,"contact_allowed":true}' > /tmp/sms_blocked.json
          python scripts/outbound_policy.py --json '{"channel":"sms","consent":true,"contact_allowed":true}' > /tmp/sms_allowed.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/sms_blocked.json'))['allowed'] is False
          assert json.load(open('/tmp/sms_allowed.json'))['allowed'] is True
          PY
      - name: Smoke test checkout requires explicit purchase intent
        env:
          REVENUE_DB_PATH: /tmp/revenue_agent.db
          CHECKOUT_URL_TEMPLATE: "https://pay.example.test/checkout?lead={lead_id}&email={email}&amount={amount}&offer={offer}"
        run: |
          LEAD_ID=$(python - <<'PY'
          import sqlite3
          c=sqlite3.connect('/tmp/revenue_agent.db')
          print(c.execute('select id from leads limit 1').fetchone()[0])
          PY
          )
          python scripts/checkout_link.py "$LEAD_ID" --email jane@example.com > /tmp/checkout.json
          python scripts/record_event.py "$LEAD_ID" interested
          python scripts/next_actions.py > /tmp/interest-actions.json
          python scripts/record_event.py "$LEAD_ID" affirmative_purchase_intent
          python scripts/next_actions.py > /tmp/purchase-actions.json
          python - <<'PY'
          import json
          checkout=json.load(open('/tmp/checkout.json'))
          interest=json.load(open('/tmp/interest-actions.json'))
          purchase=json.load(open('/tmp/purchase-actions.json'))
          assert checkout['ready'] is True
          assert interest['actions'][0]['action'] == 'review_reply'
          assert purchase['actions'][0]['action'] == 'send_checkout'
          assert 'pay.example.test' in purchase['actions'][0]['checkout_url']
          PY
      - name: Smoke test idempotent payment and reporting
        env:
          REVENUE_DB_PATH: /tmp/revenue_agent.db
        run: |
          LEAD_ID=$(python - <<'PY'
          import sqlite3
          c=sqlite3.connect('/tmp/revenue_agent.db')
          print(c.execute('select id from leads limit 1').fetchone()[0])
          PY
          )
          python scripts/record_payment.py "$LEAD_ID" evt_ci_1 --amount 100 --processor test > /tmp/pay1.json
          python scripts/record_payment.py "$LEAD_ID" evt_ci_1 --amount 100 --processor test > /tmp/pay2.json
          python scripts/revenue_report.py > /tmp/report.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/pay1.json'))['duplicate'] is False
          assert json.load(open('/tmp/pay2.json'))['duplicate'] is True
          report=json.load(open('/tmp/report.json'))
          assert report['sales'] == 1
          assert report['net_revenue'] == 100
          PY
      - name: Test consented inbound validation
        run: node --test tests/revenue_inbound_validation.test.mjs
      - name: Test Stripe revenue event normalization
        run: node --test tests/stripe_paid_event.test.mjs tests/stripe_apex_ownership.test.mjs tests/stripe_webhook_body.test.mjs tests/stripe_lead_attribution.test.mjs

